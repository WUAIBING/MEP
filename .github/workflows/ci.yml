name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - security/**
  pull_request:
    branches:
      - main
      - feat/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint
        run: ruff check hub/ node/ core/ tests/

      - name: Run tests
        run: python -m pytest tests/test_core_ledger.py tests/test_hub_auth.py tests/test_hub_api_smoke.py -v --tb=short --cov=core --cov=hub --cov-report=term-missing
